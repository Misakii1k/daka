<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="auto" fill="none">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- 主卡片渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- 橙色高光渐变（符合 DESIGN.md: #FF5B2E） -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5B2E" />
      <stop offset="100%" stop-color="#FF784B" />
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 轻微投影 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 背景底色与细腻工业网格 -->
  <rect width="1200" height="460" fill="url(#bgGrad)" rx="16" />
  
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    
    <line x1="120" y1="0" x2="120" y2="460" />
    <line x1="300" y1="0" x2="300" y2="460" />
    <line x1="480" y1="0" x2="480" y2="460" />
    <line x1="660" y1="0" x2="660" y2="460" />
    <line x1="840" y1="0" x2="840" y2="460" />
    <line x1="1020" y1="0" x2="1020" y2="460" />
  </g>

  <!-- 左侧：产品定位、标题、特性标识 -->
  <g transform="translate(64, 56)">
    <!-- 状态胶囊徽标 -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#FF5B2E" />
    <text x="30" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">LOCAL-FIRST · 100% 零 EMOJI · PWA &amp; ANDROID</text>

    <!-- 主标题与英文副标题 -->
    <text x="0" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">工时打卡系统</text>
    <text x="0" y="132" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">Daka Worklog · 极简工时考勤与薪资核算对账工具</text>

    <!-- 叙事陈述 -->
    <text x="0" y="184" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" line-height="24">
      <tspan x="0" dy="0">为灵活就业、多工时、兼职及项目制量身打造。</tspan>
      <tspan x="0" dy="26">以“一天就是一条时间带”为核心视觉哲学，纯粹无扰、离网可用。</tspan>
      <tspan x="0" dy="26">支持热敏小票对账单排版、相册原生保存与财务级标准 CSV 导出。</tspan>
    </text>

    <!-- 特性标签徽章组 -->
    <g transform="translate(0, 280)">
      <!-- 标签 1 -->
      <rect x="0" y="0" width="124" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">离线优先架构</text>

      <!-- 标签 2 -->
      <rect x="136" y="0" width="124" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="150" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">零冗余去括号</text>

      <!-- 标签 3 -->
      <rect x="272" y="0" width="138" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="286" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">Android 原生保存</text>

      <!-- 标签 4 -->
      <rect x="422" y="0" width="98" height="32" rx="6" fill="#1E293B" stroke="#FF5B2E" stroke-opacity="0.6" stroke-width="1" />
      <text x="436" y="20" fill="#FF784B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700">包体 &lt; 5MB</text>
    </g>
  </g>

  <!-- 右侧：拟真设计系统卡片（还原真实 UI 与时间带视觉） -->
  <g transform="translate(680, 44)" filter="url(#cardShadow)">
    <!-- 卡片外框 -->
    <rect width="456" height="368" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- 顶部状态栏仿真 -->
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#EF4444" opacity="0.8" />
    <rect x="34" y="20" width="8" height="8" rx="4" fill="#F59E0B" opacity="0.8" />
    <rect x="48" y="20" width="8" height="8" rx="4" fill="#10B981" opacity="0.8" />
    <text x="370" y="28" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">REC-202610</text>

    <!-- 今日工时大字显示区域 -->
    <g transform="translate(24, 48)">
      <text x="0" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="500">已工作工时</text>
      <!-- 大数字 8.5 小时 -->
      <text x="0" y="76" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" font-feature-settings="'tnum'">8.5</text>
      <text x="96" y="70" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600">小时</text>

      <rect x="310" y="38" width="96" height="28" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
      <text x="328" y="56" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700">考勤正常</text>
    </g>

    <!-- 核心组件：0-24点时间带 (DESIGN.md 规范) -->
    <g transform="translate(24, 150)">
      <text x="0" y="-8" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">时间带 · 09:00 - 18:30 (午休 60m)</text>
      
      <!-- 底轨 -->
      <rect x="0" y="4" width="408" height="38" rx="8" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      
      <!-- 橙色工作时段 (09:00 - 18:30 占比约 39.5%，从 37.5% 处开始) -->
      <rect x="153" y="8" width="161" height="30" rx="6" fill="url(#accentGrad)" filter="url(#orangeGlow)" opacity="0.9" />

      <!-- 现在指示标 (18:30) -->
      <line x1="314" y1="2" x2="314" y2="44" stroke="#FFFFFF" stroke-width="2.5" />
      <polygon points="314,0 310,-6 318,-6" fill="#FFFFFF" />

      <!-- 刻度数字 -->
      <text x="0" y="58" fill="#475569" font-family="monospace" font-size="11">0</text>
      <text x="98" y="58" fill="#475569" font-family="monospace" font-size="11">6</text>
      <text x="200" y="58" fill="#475569" font-family="monospace" font-size="11">12</text>
      <text x="302" y="58" fill="#475569" font-family="monospace" font-size="11">18</text>
      <text x="396" y="58" fill="#475569" font-family="monospace" font-size="11">24</text>
    </g>

    <!-- 考勤数据三栏 -->
    <g transform="translate(24, 240)">
      <rect width="408" height="66" rx="8" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
      
      <g transform="translate(20, 16)">
        <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">上班打卡</text>
        <text x="0" y="24" fill="#F8FAFC" font-family="monospace" font-size="17" font-weight="700">09:00</text>
      </g>

      <line x1="136" y1="12" x2="136" y2="54" stroke="#1E293B" stroke-width="1" />

      <g transform="translate(156, 16)">
        <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">下班打卡</text>
        <text x="0" y="24" fill="#F8FAFC" font-family="monospace" font-size="17" font-weight="700">18:30</text>
      </g>

      <line x1="272" y1="12" x2="272" y2="54" stroke="#1E293B" stroke-width="1" />

      <g transform="translate(292, 16)">
        <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">预计核算薪资</text>
        <text x="0" y="24" fill="#10B981" font-family="monospace" font-size="17" font-weight="700">￥255.00</text>
      </g>
    </g>

    <!-- 底部状态指示 -->
    <g transform="translate(24, 326)">
      <circle cx="6" cy="10" r="3" fill="#10B981" />
      <text x="16" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">数据全本地持久化 · 支持一键导出财务长图与表格</text>
    </g>
  </g>
</svg>

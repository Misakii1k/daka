name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Emoji guard
        run: npm run check:emoji

      - name: Reference guard
        run: npm run check:refs

      - name: Version guard
        run: npm run check:versions

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build:web

      - name: Verify www output
        run: npm run check:www
